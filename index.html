<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="玄览 · 术数聚合平台 —— 一次输入，八字·紫微·奇门·六壬·梅花·占星·塔罗八大体系并排推演，六轴共识交叉验证；确定性内核，结果可复现、可溯源。" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="color-scheme" content="dark light" />

    <!-- 首屏防闪：在 CSS/JS 加载前确定主题，避免浅色模式刷新时闪一下暗色 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('xuanlan.theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var meta = document.querySelector('meta[name=theme-color]');
          if (meta) meta.setAttribute('content', t === 'light' ? '#f3ecdd' : '#0a0e1a');
          var f = localStorage.getItem('xuanlan.font');
          if (f !== 'serif' && f !== 'sans') f = 'serif';
          document.documentElement.setAttribute('data-font', f);
        } catch (e) {}
      })();
    </script>

    <!-- 中文衬线/无衬线（展示级字体；离线时由 CSS 系统字体兜底）
         ⚠️ 必须**非阻塞**加载。实测（Fast 3G，iPhone 尺寸）这份 Google Fonts 样式表
         有 **181.5KB** —— CJK 按 unicode-range 被切成上百个 @font-face，光清单就这个体积，
         比本站自己的 CSS（30KB）大 6 倍，而且是渲染阻塞资源：
         FCP 2064ms 里 93% 花在等阻塞资源下完，其中 90% 就是它（单它 1744ms）。
         更要紧的是 fonts.googleapis.com 在境内常被墙 —— 阻塞写法等于让首屏一直空着
         等连接失败，而用户其实早就可以看到内容了。
         改法：media="print" + onload 换回 all（<noscript> 兜底），配 URL 里已有的
         display=swap —— 先用系统字体立刻渲染，字体到了再换。preconnect/preload 保留，
         让请求尽早发出但**不占渲染路径**。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      />
    </noscript>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>玄览 · 八顾问合议 —— 术数聚合推演</title>

    <!-- 社交分享预览卡（微信 / Telegram / Twitter 等） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="玄览" />
    <meta property="og:title" content="玄览 · 八顾问合议" />
    <meta property="og:description" content="八大术数体系并排推演同一问题，六轴共识告诉你它们想到一块没有。确定性内核：同一输入永远同一输出，分享链接可逐字回放。" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="玄览 · 八顾问合议" />
    <meta name="twitter:description" content="八字·紫微·奇门·六壬·梅花·占星·塔罗同台交叉验证，结果可复现可溯源。" />
  </head>
  <!-- data-pagefind-ignore：本站的产物还会被镜像到个人博客的 /xuanlan/（Cloudflare Pages 通道，
       那边用 pagefind 做站内搜索，构建期扫描 dist/ 里所有 HTML）。不加这个属性，搜索结果里
       会出现一整页工具界面、每条记录都是同一页的不同片段。对 GitHub Pages 那条通道无影响
       —— 那边没有 pagefind。 -->
  <body data-pagefind-ignore>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
